<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Btoti</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #6A0DAD; /* Royal purple */
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .heart {
            position: relative;
            width: 200px;
            height: 200px;
            background: red;
            transform: rotate(-45deg);
            animation: pulse 1.5s infinite ease-in-out; /* Heart beat animation */
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 200px;
            height: 200px;
            background: red;
            border-radius: 50%;
        }

        .heart:before {
            left: 100px;
            top: 0;
        }

        .heart:after {
            top: -100px;
            left: 0;
        }

        .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7); /* Text shadow for clarity */
            z-index: 1;
        }

        /* Animation for the heart's pulse */
        @keyframes pulse {
            0% {
                transform: rotate(-45deg) scale(1);
            }
            50% {
                transform: rotate(-45deg) scale(1.1);
            }
            100% {
                transform: rotate(-45deg) scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="heart">
        <div class="text">My Btoti</div>
    </div>
</body>
</html>
